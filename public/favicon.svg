<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#030712" />
  <polygon points="50,15 85,35 85,75 50,95 15,75 15,35" fill="none" stroke="url(#cyberGrad)" stroke-width="4" filter="url(#glow)" />
  <polygon points="50,28 73,42 73,68 50,82 27,68 27,42" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.6" />
  <circle cx="50" cy="55" r="8" fill="#00f5d4" filter="url(#glow)" />
</svg>
